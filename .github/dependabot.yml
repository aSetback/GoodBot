version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 3.5.x is ESM-only ("type": "module"); sequelize's dialect loader
      # uses a synchronous require(), which crashes on any 3.5.x version.
      - dependency-name: "mariadb"
        versions: [">=3.5.0"]
      # 6.x is ESM-only; index.js loads it with require().
      - dependency-name: "enmap"
        versions: [">=6.0.0"]
