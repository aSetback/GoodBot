version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 3.5.x is ESM-only ("type": "module"); sequelize's dialect loader
      # uses a synchronous require(), which crashes on any 3.5.x version.
      - dependency-name: "mariadb"
        versions: [">=3.5.0"]
      # 5.0.2+ pulls in ky, which is ESM-only in every release (1.x and
      # 2.x alike); crashes require() the moment /exportsheet runs.
      - dependency-name: "google-spreadsheet"
        versions: [">=5.0.2"]
      # 3.x is ESM-only; functions/watch.js requires it with require().
      - dependency-name: "node-fetch"
        versions: [">=3.0.0"]
